services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_app
    volumes:
      - ./src:/var/www
    ports:
      - "8000:9000"
    depends_on:
      - db
    networks:
      - ticket_network

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_cron
    command: ["sh", "-c", "crontab /etc/laravel-cron && cron && tail -f /var/log/cron.log"]
    volumes:
      - ./src:/var/www
      - ./docker/laravel/laravel-cron:/etc/laravel-cron:ro
      - ./logs/cron.log:/var/log/cron.log
    depends_on:
      - app
    networks:
      - ticket_network

  nginx:
    image: nginx:stable-alpine
    container_name: ticket_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ticket_network

  db:
    image: mysql:8.0
    container_name: ticket_db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ticket
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ticket_network

networks:
  ticket_network:
    driver: bridge

volumes:
  db_data:
